    <path d="M1078,247 L1078,337 M1042,275 L1114,305 M1042,305 L1114,275" stroke="#b51218" stroke-width="3"/>

    <text x="1078" y="390" text-anchor="middle" class="body">
      <tspan x="1078" dy="0">Random Forest</tspan>
      <tspan x="1078" dy="24">(modelo_risco.pkl)</tspan>
    </text>
  </g>

  <!-- 6 -->
  <g>
    <rect x="1200" y="155" rx="16" ry="16" width="215" height="370" fill="#fff" stroke="#d01920" stroke-width="2"/>
    <circle cx="1227" cy="188" r="17" fill="#b51218"/>
    <text x="1227" y="194" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">6</text>
    <text x="1253" y="190" class="box-title">Processamento</text>
    <text x="1253" y="213" class="box-title">do risco</text>

    <polyline points="1265,300 1290,275 1310,286 1345,245" fill="none" stroke="#b51218" stroke-width="4"/>
    <line x1="1345" y1="245" x2="1345" y2="267" stroke="#b51218" stroke-width="4"/>
    <line x1="1345" y1="245" x2="1323" y2="245" stroke="#b51218" stroke-width="4"/>
    <rect x="1262" y="318" width="14" height="28" fill="#b51218"/>
    <rect x="1285" y="307" width="14" height="39" fill="#b51218"/>
    <rect x="1308" y="295" width="14" height="51" fill="#b51218"/>
    <rect x="1331" y="279" width="14" height="67" fill="#b51218"/>

    <text x="1307" y="385" text-anchor="middle" class="body">
      <tspan x="1307" dy="0">probabilidade de</tspan>
      <tspan x="1307" dy="23">sinistro →</tspan>
      <tspan x="1307" dy="23">score 0–100 →</tspan>
      <tspan x="1307" dy="23">classe de risco →</tspan>
      <tspan x="1307" dy="23">top 3 fatores</tspan>
    </text>
  </g>

  <!-- arrows top row -->
  <line x1="230" y1="340" x2="258" y2="340" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="465" y1="340" x2="493" y2="340" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="340" x2="728" y2="340" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="955" y1="340" x2="983" y2="340" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1170" y1="340" x2="1198" y2="340" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Audit -->
  <g>
    <rect x="85" y="590" rx="16" ry="16" width="305" height="285" fill="#fff" stroke="#d01920" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="120" y="635" class="section-title">Trilha de auditoria</text>

    <rect x="115" y="675" width="245" height="45" rx="7" fill="#fff8f8" stroke="#e4b3b6"/>
    <text x="237" y="703" text-anchor="middle" class="event">TELEMETRIA_RECEBIDA</text>

    <rect x="115" y="735" width="245" height="45" rx="7" fill="#fff8f8" stroke="#e4b3b6"/>
    <text x="237" y="763" text-anchor="middle" class="event">PREDICAO_GERADA</text>

    <rect x="115" y="795" width="245" height="45" rx="7" fill="#fff8f8" stroke="#e4b3b6"/>
    <text x="237" y="823" text-anchor="middle" class="event">ALERTA_GERADO</text>
  </g>

  <!-- Dashboard -->
  <g>
    <rect x="535" y="590" rx="16" ry="16" width="490" height="285" fill="#fff" stroke="#d01920" stroke-width="2"/>
    <circle cx="565" cy="622" r="17" fill="#b51218"/>
    <text x="565" y="628" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">8</text>
    <text x="595" y="628" class="section-title">Dashboard Streamlit</text>

    <rect x="690" y="665" width="180" height="90" rx="8" fill="none" stroke="#b51218" stroke-width="4"/>
    <line x1="710" y1="735" x2="850" y2="735" stroke="#b51218" stroke-width="4"/>
    <circle cx="735" cy="700" r="23" fill="#b51218"/>
    <path d="M735,677 L735,700 L758,700" fill="none" stroke="#fff" stroke-width="3"/>
    <line x1="790" y1="690" x2="835" y2="690" stroke="#b51218" stroke-width="4"/>
    <line x1="790" y1="707" x2="835" y2="707" stroke="#b51218" stroke-width="4"/>
    <rect x="795" y="718" width="10" height="16" fill="#b51218"/>
    <rect x="812" y="711" width="10" height="23" fill="#b51218"/>
    <rect x="829" y="700" width="10" height="34" fill="#b51218"/>

    <rect x="565" y="790" width="135" height="50" rx="8" fill="#f4fff5" stroke="#5ea26a"/>
    <text x="632" y="820" text-anchor="middle" class="pill" fill="#247b33">Operador</text>

    <rect x="710" y="790" width="135" height="50" rx="8" fill="#f4f8ff" stroke="#5d7fb8"/>
    <text x="777" y="820" text-anchor="middle" class="pill" fill="#245ca2">Gestor</text>

    <rect x="855" y="790" width="140" height="50" rx="8" fill="#fbf5ff" stroke="#8a65b5"/>
    <text x="925" y="820" text-anchor="middle" class="pill" fill="#6b3aa1">Seguradora</text>
  </g>

  <!-- Alerts -->
  <g>
    <rect x="1145" y="590" rx="16" ry="16" width="250" height="285" fill="#fff" stroke="#d01920" stroke-width="2"/>
    <circle cx="1175" cy="622" r="17" fill="#b51218"/>
    <text x="1175" y="628" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">7</text>
    <text x="1205" y="628" class="section-title">Alertas preventivos</text>

    <path d="M1268,690 C1268,665 1285,650 1307,650 C1329,650 1346,665 1346,690 L1346,724 L1360,744 L1254,744 L1268,724 Z"
          fill="#b51218"/>
    <circle cx="1307" cy="755" r="9" fill="#b51218"/>

    <text x="1270" y="810" text-anchor="middle" class="body">
      <tspan x="1270" dy="0">geração de alerta para</tspan>
      <tspan x="1270" dy="24">risco Alto / Crítico</tspan>
    </text>
  </g>

  <!-- lower arrows -->
  <line x1="1307" y1="525" x2="1307" y2="588" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1145" y1="730" x2="1027" y2="730" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="735" x2="533" y2="735" stroke="#d01920" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- audit links -->
  <polyline points="250,590 250,548 362,548 362,526" fill="none" stroke="#c33" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#dashArrow)"/>
  <polyline points="390,620 470,620 470,560 840,560 840,526" fill="none" stroke="#c33" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#dashArrow)"/>

  <!-- Footer summary -->
  <rect x="145" y="915" rx="14" ry="14" width="1150" height="90" fill="#fff" stroke="#e2a7aa" stroke-width="2"/>
  <circle cx="190" cy="960" r="28" fill="#b51218"/>
  <polyline points="176,960 187,971 207,946" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="235" y="952" class="footer">MVP integrado da Sprint 3:</text>
  <text x="460" y="952" class="body">dados entram pela API, são validados, persistidos,</text>
  <text x="235" y="981" class="body">processados pelo modelo e exibidos no dashboard com rastreabilidade.</text>
</svg>
